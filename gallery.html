<body style="font-family: sans-serif; padding: 40px; text-align: center;">
  <p>Redirecting to <a href="index.html">Dental Clinic Home</a>...</p>

  <!-- PWA Mobile Install Floating Prompt -->
  <div id="pwa-install-banner" class="hidden fixed bottom-5 left-4 right-4 sm:left-auto sm:right-6 sm:w-96 bg-dark-950 text-white p-4 rounded-2xl shadow-2xl border border-emerald-500/40 z-50 flex items-center justify-between gap-4 backdrop-blur-md">
    <div class="flex items-center gap-3">
      <img src="assets/icon-192.png" alt="Dental Clinic App Icon" class="w-11 h-11 rounded-xl shadow-md border border-emerald-400/30">
      <div>
        <div class="text-xs font-bold text-emerald-400 uppercase tracking-wide">Install Web App</div>
        <div class="text-sm font-extrabold text-white leading-tight">Dental Clinic</div>
        <div class="text-[11px] text-slate-300">Fast offline access &amp; instant booking</div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="triggerPWAInstall()" class="bg-emerald-500 hover:bg-emerald-400 text-dark-950 font-extrabold text-xs px-3.5 py-2 rounded-xl shadow transition">
        Install
      </button>
      <button onclick="document.getElementById('pwa-install-banner').classList.add('hidden')" class="text-slate-400 hover:text-white p-1.5 text-xs font-bold">
        &times;
      </button>
    </div>
  </div>

  <!-- PWA Service Worker Registration & Install Banner -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA ServiceWorker registered successfully:', reg.scope))
          .catch(err => console.error('PWA ServiceWorker registration failed:', err));
      });
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('pwa-install-banner');
      if (banner) banner.classList.remove('hidden');
    });

    function triggerPWAInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User installed the Dental Clinic PWA');
          }
          deferredPrompt = null;
          const banner = document.getElementById('pwa-install-banner');
          if (banner) banner.classList.add('hidden');
        });
      }
    }
  </script>

</body>
</html>
